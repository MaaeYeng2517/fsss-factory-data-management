services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: 123456789
      MYSQL_DATABASE: mms
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456789"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mysqldata:
